name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Fix gradlew permission
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Clean Gradle cache to avoid corrupted JARs
      - name: Clean Gradle cache
        run: rm -rf ~/.gradle/caches/

      # 5. Cache Gradle for faster builds
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Build project
      - name: Build with Gradle
        run: ./gradlew clean assembleDebug --refresh-dependencies --stacktrace

      # 7. Run Unit Tests
      - name: Run Unit Tests
        run: ./gradlew test

      # 8. SonarCloud analysis
      - name: SonarCloud Scan
        run: ./gradlew sonarqube \
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
          -Dsonar.organization=${{ secrets.SONAR_ORG }} \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.branch.name=${GITHUB_REF_NAME}

      # 9. Upload APK as Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
