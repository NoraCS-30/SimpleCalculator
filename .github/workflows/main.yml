           distribution: 'temurin'
           java-version: 17
            
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew


        - name: SonarCloud Scan
          run: ./gradlew sonarqube -Dsonar.login=${{ secrets.SONAR_TOKEN }}
